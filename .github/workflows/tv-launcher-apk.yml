name: Build TV launcher APK

on:
  push:
    paths:
      - "tv-launcher/**"
      - ".github/workflows/tv-launcher-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tv-launcher
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APK
        run: ./gradlew assembleDebug --no-daemon
        env:
          # Optional: add a repository secret named TMDB_API_KEY to bake it into the APK.
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: home-tv-apk
          path: tv-launcher/app/build/outputs/apk/debug/app-debug.apk
